name: Build CV

on:
  push:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y emacs-nox weasyprint
      - run: emacs --batch cv.org -f org-html-export-to-html
      - run: weasyprint cv.html cv.pdf
      - run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest cv.html cv.pdf --title "Latest CV" --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: mkdir site && cp cv.html cv.pdf site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
